[gcode_macro UNLOAD_FILAMENT_PLA]
description: Heat hotend and retract filament for unloading
gcode:
    {% set TEMP = params.TEMP|default(220)|int %}  ; Default 220°C if no temp given
    {% set RETRACT = params.RETRACT|default(80)|float %}  ; Total retract distance in mm (adjust if needed)
    
    M117 Heating hotend to {TEMP}°C...
    M104 S{TEMP}          ; Set hotend temp (no wait)
    M109 S{TEMP}          ; Wait for hotend to reach temp
    
    RESPOND MSG="Unloading filament..."
    M83                   ; Relative extrusion mode
    G1 E10 F300           ; Slow prime to clear nozzle
    G1 E-{RETRACT} F1800  ; Fast retract (80mm is good for KE direct-drive)
    G1 E-20 F3000         ; Extra fast pull to clear gears
    
    M117 Filament unloaded! Turn off hotend if done.

[gcode_macro UNLOAD_FILAMENT_PETG]
description: Heat hotend and retract filament for unloading
gcode:
    {% set TEMP = params.TEMP|default(240)|int %}  ; Default 220°C if no temp given
    {% set RETRACT = params.RETRACT|default(80)|float %}  ; Total retract distance in mm (adjust if needed)
    
    M117 Heating hotend to {TEMP}°C...
    M104 S{TEMP}          ; Set hotend temp (no wait)
    M109 S{TEMP}          ; Wait for hotend to reach temp
    
    RESPOND MSG="Unloading filament..."
    M83                   ; Relative extrusion mode
    G1 E10 F300           ; Slow prime to clear nozzle
    G1 E-{RETRACT} F1800  ; Fast retract (80mm is good for KE direct-drive)
    G1 E-20 F3000         ; Extra fast pull to clear gears
    
    M117 Filament unloaded! Turn off hotend if done.

[gcode_macro LOAD_PLA]
description: Load filament at PLA temperature (220°C default)
gcode:
    {% set TEMP = params.TEMP|default(220)|int %}  ; PLA-safe default
    {% set EXTRUDE = params.EXTRUDE|default(70)|float %}  ; Total extrude distance in mm
    
    M117 Heating hotend to {TEMP}°C for PLA load...
    M104 S{TEMP}
    M109 S{TEMP}
    
    RESPOND MSG="Loading PLA filament - insert filament now!"
    M83                   ; Relative extrusion mode
    G1 E{EXTRUDE} F600    ; Slow steady extrude (adjust speed if needed)
    G1 E20 F300           ; Final fast push to seat it
    
    M117 PLA loaded! Ready to print.

[gcode_macro LOAD_PETG]
description: Load filament at PETG temperature (240°C default)
gcode:
    {% set TEMP = params.TEMP|default(240)|int %}  ; PETG-safe default
    {% set EXTRUDE = params.EXTRUDE|default(70)|float %}
    
    M117 Heating hotend to {TEMP}°C for PETG load...
    M104 S{TEMP}
    M109 S{TEMP}
    
    RESPOND MSG="Loading PETG filament - insert filament now!"
    M83
    G1 E{EXTRUDE} F600    ; Slow steady extrude
    G1 E20 F300           ; Final push
    
    M117 PETG loaded! Ready to print.