[gcode_macro UNLOAD_FILAMENT_PLA]
description: Heat hotend and retract filament for unloading
gcode:
    {% set TEMP = params.TEMP|default(220)|int %}  ; Default 220°C if no temp given
    {% set RETRACT = params.RETRACT|default(80)|float %}  ; Total retract distance in mm (adjust if needed)
    
    M117 Heating hotend to {TEMP}°C...
    M104 S{TEMP}          ; Set hotend temp (no wait)
    M109 S{TEMP}          ; Wait for hotend to reach temp
    
    RESPOND MSG="Unloading filament..."
    M83                   ; Relative extrusion mode
    G1 E10 F300           ; Slow prime to clear nozzle
    G1 E-{RETRACT} F1800  ; Fast retract (80mm is good for KE direct-drive)
    G1 E-20 F3000         ; Extra fast pull to clear gears
    
    M117 Filament unloaded! Turn off hotend if done.

